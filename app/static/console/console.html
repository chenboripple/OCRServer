<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Server Console</title>
  <link rel="stylesheet" href="console/assets/console.css?v=20260924-1" />
  <script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script defer src="console/assets/console.js?v=20260924-1"></script>
</head>
<body>
  <div id="app">
    <div
      v-if="hoverTooltip"
      class="task-tooltip"
      :style="{ left: `${hoverTooltip.left}px`, top: `${hoverTooltip.top}px`, width: `${hoverTooltip.width}px` }"
    >{{ hoverTooltip.text }}</div>
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>OCR Review Console</h1>
          <div class="muted">Vue3 portal for requests, analysis results and push config</div>
        </div>
      </div>
      <div class="muted top-meta">Last refresh: {{ formatTime(lastRefreshAt) }}</div>
    </header>

    <nav class="tabs">
      <button class="tab" :class="{ active: activeTab === 'review' }" @click="switchTab('review')">审核看板</button>
      <button class="tab" :class="{ active: activeTab === 'config' }" @click="switchTab('config')">项目配置</button>
    </nav>

    <main class="layout">
      <template v-if="activeTab === 'review'">
      <section class="card console-overview">
        <div class="section-title">
          <span>Dashboard</span>
          <div class="section-actions">
            <select v-model.number="dashboardDays" @change="applyFilters">
              <option :value="7">7 days</option>
              <option :value="14">14 days</option>
              <option :value="30">30 days</option>
            </select>
            <button class="ghost" @click="reloadAll">Refresh</button>
          </div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="label">Total tasks</div><div class="value">{{ dashboard.overview.total || 0 }}</div></div>
          <div class="kpi"><div class="label">Done</div><div class="value">{{ dashboard.overview.done_count || 0 }}</div></div>
          <div class="kpi"><div class="label">Failed</div><div class="value">{{ dashboard.overview.failed_count || 0 }}</div></div>
          <div class="kpi"><div class="label">Queued + Running</div><div class="value">{{ (dashboard.overview.queued_count || 0) + (dashboard.overview.running_count || 0) }}</div></div>
          <div class="kpi"><div class="label">Approve Rate</div><div class="value">{{ pct(dashboard.overview.approve_rate || 0) }}</div></div>
          <div class="kpi"><div class="label">Total Tokens</div><div class="value">{{ number(dashboard.stats.total_tokens || 0) }}</div></div>
        </div>
        <div class="toolbar">
          <div class="field">
            <label>Status</label>
            <select v-model="filters.status">
              <option value="">All</option>
              <option value="queued">queued</option>
              <option value="running">running</option>
              <option value="done">done</option>
              <option value="failed">failed</option>
              <option value="cancelled">cancelled</option>
            </select>
          </div>

          <div class="field">
            <label>Source</label>
            <select v-model="filters.source">
              <option value="">All</option>
              <option value="webhook">webhook</option>
              <option value="api">api</option>
            </select>
          </div>

          <div class="field">
            <label>Approve</label>
            <select v-model="filters.approve">
              <option value="">All</option>
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
          </div>

          <div class="field">
            <label>Project ID</label>
            <input v-model.trim="filters.project_id" placeholder="project id" />
          </div>

          <div class="field">
            <label>标签</label>
            <select v-model="filters.tag_id">
              <option value="">All</option>
              <option v-for="t in tags" :key="t.tag_id" :value="t.tag_id">{{ t.name }}</option>
            </select>
          </div>

          <div class="field">
            <label>MR IID</label>
            <input v-model.trim="filters.mr_iid" placeholder="mr iid" />
          </div>

          <div class="field field-span-2">
            <label>Keyword</label>
            <input v-model.trim="filters.q" placeholder="task id, branch, summary, error, session" />
          </div>

          <div class="field">
            <label>Actions</label>
            <div class="inline-actions">
              <button @click="applyFilters">Search</button>
              <button class="ghost" @click="resetFilters">Reset</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <span>Tasks</span>
          <span class="muted">{{ taskData.total }} total</span>
        </div>
        <div class="table-wrap">
          <table class="tasks-table">
            <thead>
              <tr>
                <th class="col-project-name">Project</th>
                <th class="col-mr">MR</th>
                <th class="col-status">Status</th>
                <th class="col-approve">Approve</th>
                <th class="col-time">Dispatched</th>
                <th class="col-time col-started">Started</th>
                <th class="col-time col-finished">Finished</th>
                <th class="col-elapsed">Elapsed(s)</th>
                <th class="col-task">Task</th>
                <th class="col-source">Source</th>
                <th class="col-findings">Findings</th>
                <th class="col-stats">Stats</th>
                <th class="col-summary">Summary/Error</th>
              </tr>
            </thead>
            <tbody>
              <tr
                v-for="t in taskData.items"
                :key="t.task_id"
                @click="selectTask(t.task_id)"
                class="task-row"
                :class="{ active: t.task_id === selectedTaskId }"
              >
                <td class="col-project-name">
                  <div>{{ projectName(t) }}</div>
                  <div class="muted">{{ t.project_id }}</div>
                </td>
                <td class="col-mr">
                  <div>!{{ t.mr_iid }}</div>
                  <div class="muted">{{ t.source_branch }} -> {{ t.target_branch }}</div>
                </td>
                <td class="col-status"><span class="badge" :class="'s-' + t.status">{{ t.status }}</span></td>
                <td class="col-approve">
                  <span v-if="t.approve === true" class="badge s-done">pass</span>
                  <span v-else-if="t.approve === false" class="badge s-failed">reject</span>
                  <span v-else class="muted">-</span>
                </td>
                <td class="col-time">{{ compactTime(t.created_at) }}</td>
                <td class="col-time col-started">{{ compactTime(t.started_at) }}</td>
                <td class="col-time col-finished">{{ compactTime(t.finished_at) }}</td>
                <td class="col-elapsed">{{ elapsedSeconds(t.started_at, t.finished_at) }}</td>
                <td class="col-task"><span class="muted">{{ short(t.task_id) }}</span></td>
                <td class="col-source">{{ t.source || '-' }}</td>
                <td class="col-findings">
                  <span class="sev-critical">C {{ t.finding_counts.critical }}</span>
                  <span class="sev-high"> H {{ t.finding_counts.high }}</span>
                  <span class="sev-medium"> M {{ t.finding_counts.medium }}</span>
                  <span class="sev-low"> L {{ t.finding_counts.low }}</span>
                </td>
                <td class="col-stats">
                  <div>files: {{ t.stats.files_reviewed || '-' }}</div>
                  <div>tokens: {{ t.stats.total_tokens || '-' }}</div>
                </td>
                <td class="col-summary task-summary" :title="[t.summary, t.error].filter(Boolean).join(' | ')">
                  <div
                    class="task-summary-item"
                    :class="{ 'has-tooltip': t.summary }"
                    :data-tooltip="t.summary || ''"
                    @mouseenter="showTooltip($event, t.summary)"
                    @mouseleave="hideTooltip"
                  >
                    <span class="task-summary-text">{{ t.summary || '-' }}</span>
                  </div>
                  <div
                    v-if="t.error"
                    class="task-summary-item muted mt-4 has-tooltip"
                    :data-tooltip="t.error"
                    @mouseenter="showTooltip($event, t.error)"
                    @mouseleave="hideTooltip"
                  >
                    <span class="task-summary-text">{{ t.error }}</span>
                  </div>
                </td>
              </tr>
              <tr v-if="taskData.items.length === 0">
                <td colspan="13" class="muted">No tasks.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pager">
          <div>Page {{ taskPage }} / {{ taskPages }}</div>
          <div class="pager-actions">
            <button class="ghost" :disabled="taskPage <= 1" @click="changeTaskPage(taskPage - 1)">Prev</button>
            <button class="ghost" :disabled="taskPage >= taskPages" @click="changeTaskPage(taskPage + 1)">Next</button>
          </div>
        </div>
        <div v-if="taskError" class="err">{{ taskError }}</div>
      </section>

      <section class="split">
        <article class="card">
          <div class="section-title">
            <span>Task Detail</span>
            <div class="task-detail-head">
              <span class="muted task-detail-id">{{ selectedTaskId || 'none selected' }}</span>
              <button
                v-if="taskDetail && taskDetail.session_id"
                class="ghost btn-sm"
                @click="copySessionId"
              >
                Copy session_id
              </button>
            </div>
          </div>
          <div class="detail" v-if="taskDetail">
            <div class="grid-2">
              <div class="kv"><div class="k">Task ID</div><div class="v">{{ taskDetail.task_id }}</div></div>
              <div class="kv"><div class="k">Session ID</div><div class="v">{{ taskDetail.session_id || '-' }}</div></div>
              <div class="kv"><div class="k">Project / MR</div><div class="v">{{ taskDetail.project_id }} / !{{ taskDetail.mr_iid }}</div></div>
              <div class="kv"><div class="k">Source</div><div class="v">{{ taskDetail.source }}</div></div>
              <div class="kv"><div class="k">Status</div><div class="v">{{ taskDetail.status }}</div></div>
              <div class="kv"><div class="k">Approve</div><div class="v">{{ taskDetail.approve === null ? '-' : taskDetail.approve }}</div></div>
              <div class="kv"><div class="k">Created</div><div class="v">{{ taskDetail.created_at }}</div></div>
              <div class="kv"><div class="k">Started</div><div class="v">{{ taskDetail.started_at || '-' }}</div></div>
              <div class="kv"><div class="k">Finished</div><div class="v">{{ taskDetail.finished_at || '-' }}</div></div>
              <div class="kv"><div class="k">Elapsed (s)</div><div class="v">{{ elapsedSeconds(taskDetail.started_at, taskDetail.finished_at) }}</div></div>
              <div class="kv"><div class="k">Branches</div><div class="v">{{ taskDetail.source_branch }} -> {{ taskDetail.target_branch }}</div></div>
              <div class="kv"><div class="k">Commit</div><div class="v">{{ taskDetail.commit_sha || '-' }}</div></div>
            </div>

            <div class="kv">
              <div class="k">Summary</div>
              <div class="v">{{ taskDetail.summary || '-' }}</div>
            </div>

            <div class="kv" v-if="taskDetail.error">
              <div class="k">Error</div>
              <div class="v error-text">{{ taskDetail.error }}</div>
            </div>

            <div class="kv">
              <div class="k">Markdown Summary</div>
              <pre>{{ taskDetail.markdown_summary || '-' }}</pre>
            </div>

            <div class="kv">
              <div class="k">Warnings</div>
              <pre>{{ pretty(taskDetail.warnings || []) }}</pre>
            </div>

            <details class="raw" v-if="taskDetail.raw_result">
              <summary>Raw OCR Result (JSON)</summary>
              <pre class="raw-pre">{{ pretty(taskDetail.raw_result) }}</pre>
            </details>
          </div>
          <div class="detail muted" v-else>Select one task from the list.</div>
          <div v-if="detailError" class="err">{{ detailError }}</div>
          <div v-if="copiedTip" class="muted copied-tip">{{ copiedTip }}</div>
        </article>

        <article class="card">
          <div class="section-title">
            <span>Findings</span>
            <span class="muted">{{ findingData.total || 0 }} total</span>
          </div>

          <div class="toolbar toolbar-findings">
            <div class="field">
              <label>Severity</label>
              <select v-model="findingFilters.severity" @change="loadFindings(1)">
                <option value="">All</option>
                <option value="critical">critical</option>
                <option value="high">high</option>
                <option value="medium">medium</option>
                <option value="low">low</option>
              </select>
            </div>
            <div class="field">
              <label>Category</label>
              <input v-model.trim="findingFilters.category" @keyup.enter="loadFindings(1)" placeholder="category" />
            </div>
            <div class="field">
              <label>Path</label>
              <input v-model.trim="findingFilters.path" @keyup.enter="loadFindings(1)" placeholder="file path" />
            </div>
            <div class="field">
              <label>Actions</label>
              <button class="ghost" @click="loadFindings(1)" :disabled="!selectedTaskId">Apply</button>
            </div>
          </div>

          <div class="findings-list">
            <div class="finding" v-for="f in findingData.items" :key="f.id">
              <div class="head">
                <span class="badge" :class="'s-' + (taskDetail?.status || 'done')">#{{ f.position }}</span>
                <span :class="'sev-' + (f.severity || 'low')">{{ f.severity || 'unknown' }}</span>
                <span class="muted">{{ f.category || 'other' }}</span>
                <span class="path">{{ f.path }}:{{ f.start_line || f.end_line || '?' }}</span>
              </div>
              <div class="finding-content">{{ f.content }}</div>
              <div v-if="f.existing_code">
                <div class="muted">Existing code</div>
                <div class="code">{{ f.existing_code }}</div>
              </div>
              <div v-if="f.suggestion_code">
                <div class="muted">Suggestion</div>
                <div class="code">{{ f.suggestion_code }}</div>
              </div>
            </div>
            <div class="muted" v-if="findingData.items.length === 0">No findings.</div>
          </div>

          <div class="pager">
            <div>Page {{ findingPage }} / {{ findingPages }}</div>
            <div class="pager-actions">
              <button class="ghost" :disabled="findingPage <= 1" @click="loadFindings(findingPage - 1)">Prev</button>
              <button class="ghost" :disabled="findingPage >= findingPages" @click="loadFindings(findingPage + 1)">Next</button>
            </div>
          </div>
          <div v-if="findingError" class="err">{{ findingError }}</div>
        </article>
      </section>
      </template>

      <template v-else>
      <section class="card">
        <div class="section-title">
          <span>推送配置</span>
          <div class="section-actions">
            <button v-if="!channelForm.open" @click="startChannelCreate">新增推送配置</button>
            <button v-else class="ghost" @click="cancelChannelForm">取消</button>
          </div>
        </div>
        <p class="muted config-hint">
          维护可复用的群机器人 webhook(飞书 / 企业微信 / 钉钉),然后在下方项目清单里绑定。
          URL 与加签密钥保存后仅展示尾 4 位;编辑时留空表示保持不变。
        </p>

        <form v-if="channelForm.open" class="form-grid" @submit.prevent="submitChannel">
          <div class="field">
            <label>名称 *</label>
            <input v-model.trim="channelForm.name" placeholder="如:后端一组飞书群" maxlength="64" />
          </div>
          <div class="field">
            <label>类型 *</label>
            <select v-model="channelForm.type">
              <option value="feishu">飞书</option>
              <option value="wechat">企业微信</option>
              <option value="dingtalk">钉钉</option>
            </select>
          </div>
          <div class="field field-span-2">
            <label>Webhook URL {{ channelForm.editingId ? '(留空保持不变)' : '*' }}</label>
            <input v-model.trim="channelForm.webhook_url" :placeholder="channelForm.editingId ? channelForm.urlMasked : 'https://open.feishu.cn/open-apis/bot/v2/hook/xxx'" />
          </div>
          <div class="field field-span-2">
            <label>加签密钥 {{ channelForm.editingId ? '(留空保持不变)' : '(可选)' }}</label>
            <input v-model.trim="channelForm.sign_secret" :placeholder="channelForm.editingId ? channelForm.secretMasked : '机器人安全设置里的加签密钥'" />
          </div>
          <div class="field field-span-2">
            <label>Actions</label>
            <div class="inline-actions">
              <button type="submit" :disabled="channelSaving">{{ channelForm.editingId ? '保存' : '创建' }}</button>
            </div>
          </div>
          <div v-if="channelError" class="err field-span-2">{{ channelError }}</div>
        </form>

        <div class="table-wrap">
          <table class="tasks-table channels-table">
            <thead>
              <tr>
                <th>名称</th>
                <th>类型</th>
                <th>Webhook URL</th>
                <th>加签密钥</th>
                <th>绑定项目数</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="c in channels" :key="c.channel_id">
                <td>{{ c.name }}</td>
                <td><span class="type-badge" :class="'t-' + c.type">{{ typeLabel(c.type) }}</span></td>
                <td><span class="masked">{{ c.webhook_url_masked }}</span></td>
                <td><span class="masked">{{ c.sign_secret_masked }}</span></td>
                <td>{{ c.bound_project_count }}</td>
                <td>{{ compactTime(c.updated_at) }}</td>
                <td class="config-actions">
                  <button class="ghost btn-sm" :disabled="channelTesting === c.channel_id" @click="testChannel(c)">{{ channelTesting === c.channel_id ? '发送中...' : '测试' }}</button>
                  <button class="ghost btn-sm" @click="editChannel(c)">编辑</button>
                  <button class="ghost btn-sm btn-danger" @click="deleteChannel(c)">删除</button>
                </td>
              </tr>
              <tr v-if="channels.length === 0">
                <td colspan="7" class="muted">暂无推送配置。</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div v-if="channelTestResult" class="muted copied-tip" :class="channelTestResult.ok ? 'ok' : 'err'">
          {{ channelTestResult.ok ? '✅ 测试消息已发送' : '❌ ' + channelTestResult.error }}
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <span>项目标签</span>
          <span class="muted">{{ tags.length }} 个标签</span>
        </div>
        <p class="muted config-hint">
          标签需先在这里维护,再到下方项目清单给项目打标签;审核看板与项目清单均可按标签筛选。
        </p>

        <form class="tag-add-form" @submit.prevent="submitTag">
          <input v-model.trim="tagForm.name" placeholder="新标签名称,如:核心系统 / 支付 / 前端" maxlength="32" />
          <button type="submit" :disabled="tagSaving">{{ tagSaving ? '添加中...' : '添加标签' }}</button>
        </form>
        <div v-if="tagError" class="err tag-error">{{ tagError }}</div>

        <div class="tag-manage-list">
          <div class="tag-manage-item" v-for="t in tags" :key="t.tag_id">
            <template v-if="tagEditId === t.tag_id">
              <input
                class="tag-edit-input"
                v-model.trim="tagEditName"
                maxlength="32"
                @keyup.enter="saveTagEdit(t)"
                @keyup.esc="cancelTagEdit"
              />
              <button class="btn-sm" @click="saveTagEdit(t)" :disabled="tagSaving">保存</button>
              <button class="ghost btn-sm" @click="cancelTagEdit">取消</button>
            </template>
            <template v-else>
              <span class="tag-chip" :class="tagColorClass(t.name)">{{ t.name }}</span>
              <span class="muted tag-count">{{ t.project_count }} 个项目</span>
              <button class="ghost btn-sm" @click="startTagEdit(t)">重命名</button>
              <button class="ghost btn-sm btn-danger" @click="deleteTag(t)">删除</button>
            </template>
          </div>
          <div class="muted" v-if="tags.length === 0">暂无标签,先在上方添加。</div>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <span>项目清单</span>
          <span class="muted">{{ projectData.total }} total</span>
        </div>
        <p class="muted config-hint">
          审核任务到达时自动登记;也可手动添加。绑定推送配置后该项目审核结果走该通道,
          未绑定的项目回退全局 NOTIFY_* 环境变量配置。
        </p>

        <div class="toolbar">
          <div class="field">
            <label>搜索</label>
            <input v-model.trim="projectQuery" @keyup.enter="loadProjects(1)" placeholder="project id / url" />
          </div>
          <div class="field" v-if="tags.length">
            <label>按标签筛选(任一命中)</label>
            <div class="tag-filter-chips">
              <button
                type="button"
                class="tag-chip tag-toggle"
                v-for="t in tags"
                :key="t.tag_id"
                :class="[tagColorClass(t.name), { selected: projectTagFilter.includes(t.tag_id) }]"
                @click="toggleProjectTagFilter(t.tag_id)"
              >{{ t.name }}</button>
              <button v-if="projectTagFilter.length" type="button" class="ghost btn-sm" @click="clearProjectTagFilter">清除</button>
            </div>
          </div>
          <div class="field">
            <label>Actions</label>
            <div class="inline-actions">
              <button class="ghost" @click="loadProjects(1)">Search</button>
            </div>
          </div>
        </div>

        <form class="form-grid" @submit.prevent="submitProject">
          <div class="field">
            <label>手动添加:Project ID *</label>
            <input v-model.trim="projectForm.project_id" placeholder="GitLab project id(数字)" />
          </div>
          <div class="field">
            <label>项目 URL(可选)</label>
            <input v-model.trim="projectForm.project_url" placeholder="https://gitlab.example.com/group/repo" />
          </div>
          <div class="field">
            <label>绑定推送配置(可选)</label>
            <select v-model="projectForm.channel_id">
              <option value="">暂不绑定</option>
              <option v-for="c in channels" :key="c.channel_id" :value="c.channel_id">{{ c.name }} ({{ typeLabel(c.type) }})</option>
            </select>
          </div>
          <div class="field">
            <label>Actions</label>
            <div class="inline-actions">
              <button type="submit" :disabled="projectSaving">添加</button>
            </div>
          </div>
          <div v-if="projectError" class="err field-span-2">{{ projectError }}</div>
        </form>

        <div class="table-wrap">
          <table class="tasks-table projects-table">
            <thead>
              <tr>
                <th>Project ID</th>
                <th>项目 URL</th>
                <th class="col-project-tags">标签</th>
                <th>推送配置</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="p in projectData.items" :key="p.project_id" :class="{ 'tag-editing-row': editingTagsFor === p.project_id }">
                <td>{{ p.project_id }}</td>
                <td><span class="project-url">{{ p.project_url || '-' }}</span></td>
                <td class="col-project-tags">
                  <div v-if="editingTagsFor === p.project_id" class="tag-editor">
                    <template v-if="tags.length">
                      <button
                        type="button"
                        class="tag-chip tag-toggle"
                        v-for="t in tags"
                        :key="t.tag_id"
                        :class="[tagColorClass(t.name), { selected: tagEditSelection.includes(t.tag_id) }]"
                        @click="toggleTagEditSelection(t.tag_id)"
                      >{{ t.name }}</button>
                    </template>
                    <span v-else class="muted">暂无标签可选,请先在上方维护。</span>
                    <div class="inline-actions tag-editor-actions">
                      <button class="btn-sm" @click="saveProjectTags(p)" :disabled="projectTagsSaving">{{ projectTagsSaving ? '保存中...' : '保存' }}</button>
                      <button class="ghost btn-sm" @click="cancelProjectTagsEdit">取消</button>
                    </div>
                  </div>
                  <div v-else class="project-tags">
                    <span v-for="tg in p.tags" :key="tg.tag_id" class="tag-chip" :class="tagColorClass(tg.name)">{{ tg.name }}</span>
                    <span v-if="!p.tags || !p.tags.length" class="muted">-</span>
                    <button class="ghost btn-sm" @click="startProjectTagsEdit(p)">{{ (p.tags && p.tags.length) ? '编辑' : '打标签' }}</button>
                  </div>
                </td>
                <td>
                  <select class="bind-select" :value="p.channel ? p.channel.channel_id : ''" @change="bindProject(p, $event.target.value)">
                    <option value="">未绑定(使用全局配置)</option>
                    <option v-for="c in channels" :key="c.channel_id" :value="c.channel_id">{{ c.name }} ({{ typeLabel(c.type) }})</option>
                  </select>
                </td>
                <td>{{ compactTime(p.updated_at) }}</td>
              </tr>
              <tr v-if="projectData.items.length === 0">
                <td colspan="5" class="muted">暂无项目。</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pager">
          <div>Page {{ projectPage }} / {{ projectPages }}</div>
          <div class="pager-actions">
            <button class="ghost" :disabled="projectPage <= 1" @click="loadProjects(projectPage - 1)">Prev</button>
            <button class="ghost" :disabled="projectPage >= projectPages" @click="loadProjects(projectPage + 1)">Next</button>
          </div>
        </div>
        <div v-if="projectBindError" class="err">{{ projectBindError }}</div>
      </section>
      </template>
    </main>
  </div>

</body>
</html>
